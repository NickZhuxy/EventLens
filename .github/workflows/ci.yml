name: Test and build
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c deploy/requirements.lock '.[service,test]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/service_smoke.py
      - run: python scripts/verify_live_run.py reports/deepseek-live-2026-10-08
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t eventlens:ci .
      - run: docker run --rm eventlens:ci python -c 'from eventlens.service.api import create_app; from eventlens.service.worker import Worker'
